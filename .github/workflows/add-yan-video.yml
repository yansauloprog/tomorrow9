name: Add Yan birthday video

on:
  push:
    branches:
      - thayna-surpresa
    paths:
      - .github/workflows/add-yan-video.yml

permissions:
  contents: write

jobs:
  add-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout birthday branch
        uses: actions/checkout@v4
        with:
          ref: thayna-surpresa
          fetch-depth: 0

      - name: Download optimized Yan video
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/media
          curl -L --fail --silent --show-error 'https://uc0688ca52a11e9f33109d5c1035.dl.dropboxusercontent.com/cd/0/get/DJdZINdMPl1YWtEN25PTCrNqVoki-iB0O2FTgHvU1NhRA6NQWYHaK6lECchsh6egcOGEclSnhjxuIeXXHMhiNukY28Ysu62_FLPNM5Hy9ZjiOh0n-UnKdWqbigeWXcMSC62n9MtuLnVAzPwahvUCscpWjtGKwkT88FqWIIh2lsYYqQ/file?c_luid=d9d45c48' -o public/media/yan.mp4
          echo 'bfe25ab365d1e36de2e8eebe5199082d8c1ed94d  public/media/yan.mp4' | sha1sum -c -

      - name: Commit video to birthday branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/media/yan.mp4
          git diff --cached --quiet && exit 0
          git commit -m 'Add Yan birthday video'
          git push origin HEAD:thayna-surpresa
